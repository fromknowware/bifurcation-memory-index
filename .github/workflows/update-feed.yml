name: Update RAM Index feed

on:
  schedule:
    # Every 6 hours at :17 — feeds, story pages, briefing, OG cards
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:          # manual trigger from the GitHub UI

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install sharp (OG card rendering)
        run: npm install --prefix scripts sharp --no-audit --no-fund --silent

      - name: Update feed + build syndication layer
        env:
          RAINDROP_API_TOKEN: ${{ secrets.RAINDROP_API_TOKEN }}
          RAINDROP_COLLECTION_ID: ${{ vars.RAINDROP_COLLECTION_ID }}
        run: |
          node scripts/feed-update.mjs
          node scripts/build-stories.mjs
          node scripts/build-briefing.mjs
          node scripts/build-og.mjs

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/stories docs/briefing docs/data/stories-index.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            TIMESTAMP=$(date -u "+%Y-%m-%d %H:%M UTC")
            git commit -m "feed: update RAM Index feed + syndication [${TIMESTAMP}]"
            git push
          fi
