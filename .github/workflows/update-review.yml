name: Update RAM Index weekly review

on:
  schedule:
    # Every Sunday 08:00 UTC — the week in review
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build weekly review
        run: node scripts/build-review.mjs

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/review
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            WEEK=$(ls docs/review | grep -E '^[0-9]{4}-W[0-9]{2}\.html$' | tail -1 | sed 's/\.html//')
            git commit -m "review: weekly review [${WEEK}]"
            git push
          fi
