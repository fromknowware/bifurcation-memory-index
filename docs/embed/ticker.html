<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The RAM Index — live ticker</title>
<style>
:root{--bg:#111416;--bg1:#171a1e;--line:#262b32;--muted:#596170;--dim:#434b58;--text:#a0acbc;--bright:#c0cad8;--ram:#e8a428;--hbm:#00b896;--comm:#c8a040;--green:#38b868;--red:#c84848;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:12px;line-height:1.5;}
a{color:inherit;text-decoration:none;}
.card{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg);}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg1);font-family:monospace;font-size:10px;font-weight:700;letter-spacing:0.08em;color:var(--bright);}
.top em{color:var(--ram);font-style:normal;}
.ri{display:flex;align-items:baseline;gap:8px;padding:10px 10px 6px;font-family:monospace;}
.ri b{font-size:34px;color:var(--ram);letter-spacing:-0.03em;line-height:1;}
.ri .chg{font-size:11px;color:var(--dim);}
.rows{padding:0 10px 8px;font-family:monospace;font-size:10px;color:var(--muted);display:flex;flex-direction:column;gap:3px;}
.row{display:flex;justify-content:space-between;}
.row b{color:var(--bright);}
.spark{padding:0 10px 8px;}
.spark canvas{display:block;width:100%;height:36px;}
.foot{border-top:1px solid var(--line);padding:5px 10px;font-family:monospace;font-size:9px;color:var(--dim);display:flex;justify-content:space-between;background:var(--bg1);}
.foot a:hover{color:var(--ram);}
.up{color:var(--green);} .dn{color:var(--red);}
</style>
</head>
<body>
<div class="card">
  <div class="top"><span>RAM <em>INDEX</em> · live</span><span id="t-date">—</span></div>
  <div class="ri">
    <b id="t-ri">—</b>
    <span class="chg" id="t-chg">—</span>
  </div>
  <div class="rows">
    <div class="row"><span>R<sub>C</sub> commodity</span><b id="t-rc" style="color:var(--comm)">—</b></div>
    <div class="row"><span>R<sub>AI</sub> / HBM</span><b id="t-rai" style="color:var(--hbm)">—</b></div>
    <div class="row"><span>HBM weight ω</span><b id="t-w">—</b></div>
  </div>
  <div class="spark"><canvas id="t-spark"></canvas></div>
  <div class="foot"><span>Memory market signal</span><a href="https://ram-index.com" target="_blank" rel="noopener">ram-index.com →</a></div>
</div>
<script>
(function(){
  const $ = (id)=>document.getElementById(id);
  async function load(){
    try{
      const [r, s] = await Promise.all([
        fetch('../data/ri.json?_='+Date.now()).then(x=>x.json()),
        fetch('../data/stocks.json?_='+Date.now()).then(x=>x.json()),
      ]);
      const h = r.headline;
      $('t-ri').textContent = (h.ri==null?'—':Number(h.ri).toFixed(3));
      $('t-rc').textContent = (h.rc==null?'—':Number(h.rc).toFixed(3));
      $('t-rai').textContent = (h.rai==null?'—':Number(h.rai).toFixed(3));
      $('t-w').textContent = (h.hbmWeight==null?'—':Number(h.hbmWeight).toFixed(2));
      const prior = r.annual.find(d=>d.y===h.year-1);
      const chg = (prior&&prior.v!=null&&h.ri!=null)? h.ri-prior.v : null;
      const chgEl = $('t-chg');
      chgEl.textContent = chg==null?'—':((chg>=0?'+':'−')+Math.abs(chg).toFixed(3));
      chgEl.className = 'chg '+(chg>=0?'up':'dn');
      $('t-date').textContent = (s.updated||'').slice(0,10);
      // sparkline: last 24 annual readings
      const vals = r.annual.filter(d=>d.v!=null).slice(-24);
      drawSpark(vals);
    }catch(e){
      $('t-ri').textContent = '—';
    }
  }
  function drawSpark(vals){
    const cv = $('t-spark'); if(!cv) return;
    const dpr = window.devicePixelRatio||1;
    const W = cv.clientWidth||260, H = 36;
    cv.width = W*dpr; cv.height = H*dpr;
    const c = cv.getContext('2d'); c.scale(dpr,dpr);
    const min = Math.min(...vals.map(v=>v.v)), max = Math.max(...vals.map(v=>v.v));
    const pad = 4;
    const x = (i)=> pad + (W-pad*2) * (i/(vals.length-1||1));
    const y = (v)=> pad + (H-pad*2) * (1-(v-min)/((max-min)||1));
    c.beginPath();
    vals.forEach((v,i)=>{ i===0?c.moveTo(x(i),y(v.v)):c.lineTo(x(i),y(v.v)); });
    c.strokeStyle = '#e8a428'; c.lineWidth = 1.6; c.stroke();
    c.lineTo(x(vals.length-1), H); c.lineTo(x(0), H); c.closePath();
    c.fillStyle = 'rgba(232,164,40,0.10)'; c.fill();
  }
  load();
})();
</script>
</body>
</html>
